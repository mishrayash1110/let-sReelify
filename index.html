  <style>
a{
text-decoration:none;
color:white;
}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .phone {
      width: 319px;
      height:590px;
      background-color: #111;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 15px 0px 10px;
    }

    .header h1 {
    color: transparent;
  background: linear-gradient(to right,#7f00ff,#e100ff);
  -webkit-background-clip: text;
  background-clip: text;
font-size:32px;
font-family:Inria Serif;    }

    .header notification {
    font-size: 1.2em;
      cursor: pointer;}

   

    .stories {
      display: flex;
      padding: 0px 5px 15px 6px;
      overflow-x:scroll;
      overflow-y:hidden;
      scrollbar-width:none; 
    }

    .stories::-webkit-scrollbar {
      display: none;     }

    .story {
      text-align: center;
      margin-right: 10px;
    }

    .story img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid #ff69b4;
    }

    .story span {
      display: block;
      font-size: 0.65em;
      margin-top: 5px;
    }

.video
{
height:111px;
width:100%;
display:flex;
padding: 0px 0px 0px 0px;
margin:0px;
overflow-x:scroll;
overflow-y:hidden;

}
 .video::-webkit-scrollbar {
      display:none;    
}


.video div
{position:relative;
margin-right:15px;             
}
.pro{
position: absolute;
            bottom:30px;
            left: 50%;
            transform: translateX(-50%);
            width: 43px;
            height: 43px;
            border: 2px solid #fff;
            border-radius: 50%;
            overflow: hidden;
            background-color:black;
}
.pro img {
            width: 100%;
            height: 100%;
            object-fit: cover;
}
    .feed {
      padding: 10px;
      flex-grow: 1;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .feed::-webkit-scrollbar {
      display: none;
    }

    .post {
      width:100%;
      border-radius:20%;
      margin-bottom: 20px;
    }

    .post img {
      width: 100%;
      border-radius: 10px;
    }

    .post .info {
      display: flex;
      align-items: center;
      margin-top: 10px;
    }

    .post .info img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .post .info .username {
      font-weight: bold;
      font-size: 0.9em;
    }

    .post .engagement {
      font-size: 0.8em;
      color: #aaa;
      margin-top: 5px;
    }

    .footer {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid #333;
      background-color: #111;
    }

    .footer div {
      text-align: center;
      color: #fff;
      font-size: 1.2em;
      cursor: pointer;
    }

 

    .footer div:hover {
      color: #ff69b4;
    }

body{

.reels::-webkit-scrollbar {

.container{

}
.container::-webkit-scrollbar {

font-size:55px;
