<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reelify Profile</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 319px;
      height:590px;
      background-color: #111;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
a{
text-decoration:none;
}

     .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 5px 0px 10px;
    }

    .header h1{
    color: transparent;
  background: linear-gradient(to right,#7f00ff,#e100ff);
  -webkit-background-clip: text;
  background-clip: text;
font-size:32px;
font-family:Inria Serif;    }


    .profile-banner {
      position: relative;
    }

    .banner-img {
      width: 100%;
height:140px;
      border-radius: 5px;
    }

    .profile-picture {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid white;
      position: absolute;
      bottom:-40px;
      left: 50%;
      transform: translateX(-50%);
    }

    .profile-info {
      text-align: center;
      margin-top: 40px;
    }

    .profile-info h2 {
      font-size: 20px;
      margin: 5px 0;
    }

    .profile-info p {
      font-size: 14px;
      color: #ccc;
    }

    .stats {
      display: flex;
      justify-content: space-evenly;
      margin: 15px 0;
    }

    .stats div {
      text-align: center;
    }

    .stats div h3 {
      font-size: 18px;
      margin: 5px 0;
    }

    .stats div p {
      font-size: 12px;
      color: #aaa;
    }

    .tabs {
border-radius:5px;
      display: flex;
      justify-content: space-around;
      border: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 2px 7px 4px 7px;
background-color:rgba(89, 89, 90,0.5);
    }

    .tabs div {
      font-size: 18px;
      color: #666;
    }

    

    .gallery {
padding:0px 0px px 0px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 2.5px;
    }

    .gallery img {
      width: 100%;
      height:100%;
    }

    .footer {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid #333;
      background-color: #111;
    }

    .footer div {
      text-align: center;
      color: #fff;
      font-size: 1.2em;
      cursor: pointer;
    }

 

    .footer div:hover {
      color: #ff69b4;
    }

.scroll {
      padding: 7px;
      flex-grow: 1;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .scroll::-webkit-scrollbar {
      display: none;
    }
.header span{
color:white;
font-size:25px;
}
  </style>
</head>
<body>
  
  <div class="container">
    <!-- Header -->
    <div class="header">
<h1>Reelify</h1>
 <div><a href="setting.html"><span>&#8801;</span></a></div>
</div>
<section class="scroll">
    <!-- Profile Banner -->
    <div class="profile-banner">
      <img src="img5.jpg" alt="Banner" class="banner-img">
      <img src="img2.jpg" alt="Profile" class="profile-picture">
    </div>

    <div class="profile-info">
      <h2>ms.prin</h2>
      <p>ms.prin_fearless walk....</p>
    </div>

    <div class="stats">
      <div>
        <h3>42.9k</h3>
        <p>Likes</p>
      </div>
      <div>
        <h3>323</h3>
        <p>Followers</p>
      </div>
      <div>
        <h3>323</h3>
        <p>Followings</p>
      </div>
    </div>

    
    <div class="tabs">
      <div>📷</div>
      <div>🎥</div>
      <div>💾</div>
    </div>

    
    <div class="gallery">
      <img src="img1.jpg" alt="Gallery Item">
      <img src="img2.jpg" alt="Gallery Item">
      <img src="img3.jpeg" alt="Gallery Item">
      <img src="img4.jpg" alt="Gallery Item">
      <img src="img5.jpg" alt="Gallery Item">
      <img src="img6.jpg" alt="Gallery Item">
      <img src="img7.jpg" alt="Gallery Item">
      <img src="img8.jpg" alt="Gallery Item">
      <img src="img4.jpg" alt="Gallery Item">
    </div>

    </section>
    <div class="footer">
    <div><a href="index.html">🏠</a></div>
    <div><a href="explore.html">🔍</a></div>
    <div><a href="create.html">➕</a></div>
    <div><a href="like.html">❤️</a></div>
    <div><a href="profile.html">👤</a></div>
  </div>

  </div>
</body>
</html>
